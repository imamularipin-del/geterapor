<style>
:root{--ink:#0e3b3c;--ac:#f2b233;--bg:#f3f6f3;--ln:#e1e8e2;--mu:#667a79;--ok:#0f9d6b;--no:#d9480f;--lo:#fff1e6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#cfd9d4;color:#142b2b;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:600px){#app{margin:18px 0;min-height:0;height:calc(100vh - 36px);border-radius:34px;box-shadow:0 24px 70px #0e3b3c55;overflow:hidden}#m{overflow:auto}}
header{background:var(--ink);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 52px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
header h1{font-size:17px;line-height:1.25}header small{opacity:.75;font-size:12px}
#sy{font:600 11px system-ui;background:#ffffff22;padding:4px 10px;border-radius:12px;white-space:nowrap}#sy.bad{background:var(--no)}
#sw{display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:46%;flex:none}#wh{font-size:11px;opacity:.9;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgx{background:none;border:0;cursor:pointer;font-size:14px;padding:0 4px;margin-left:6px;opacity:.7}.lgx.arm{background:var(--no);color:#fff;border-radius:8px;opacity:1;font-size:11px;padding:2px 8px}
#m{flex:1;padding:0 14px 18px;margin-top:-36px;position:relative}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #0e3b3c0d}
h3{font-size:14px;margin-bottom:8px}small{color:var(--mu);font-size:12px}
.hero{background:linear-gradient(135deg,var(--ink),#1c6b66);color:#fff;border:0}.hero small{color:#cfe6e0}.big{font:700 46px/1.1 system-ui;display:block;margin:4px 0;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin:0}.st b{display:block;font-size:22px}.g2{margin-bottom:12px}
.pg{display:flex;align-items:center;gap:8px;margin:6px 0}.pg span{width:50px;font-size:12px}.pg i{flex:1;height:8px;background:#e3ebe6;border-radius:6px;overflow:hidden}.pg u{display:block;height:100%;background:var(--ink)}
.tp{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.tp b{width:24px;height:24px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:12px}.tp span{margin-left:auto;font-weight:700}
.row{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.row:active{background:#eef5f1}
.av{width:38px;height:38px;border-radius:50%;background:#e0efe9;color:var(--ink);display:grid;place-items:center;font-size:13px;flex:none}
.gr{flex:1;min-width:0}.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots u{display:inline-block;width:9px;height:9px;border-radius:50%;background:#dfe6e2;margin:3px 3px 0 0}.dots .t{background:var(--ok)}.dots .r{background:var(--ac)}
.sc{text-align:right}.sc b{font-size:20px;display:block;line-height:1;font-variant-numeric:tabular-nums}
em{font:600 10px system-ui;padding:2px 7px;border-radius:9px;font-style:normal}em.ok{background:#dcf5ea;color:#0a7a52}em.no{background:var(--lo);color:var(--no)}
.em{text-align:center;color:var(--mu);padding:20px}.ft{text-align:center;color:var(--mu);font-size:12px;margin:6px 0}
label{font-weight:600;font-size:12px;color:var(--mu);display:block;margin-top:6px}
select,input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;font:inherit;background:#fff;margin:5px 0}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.b{flex:1;padding:11px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 13px system-ui;white-space:nowrap}.b.s{background:#e3eee9;color:var(--ink)}.b.d{background:#fde8e1;color:var(--no)}
.tw{overflow-x:auto;margin:6px -14px 0;padding:0 14px}table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:center;white-space:nowrap}th{background:#e6efea}
.n{text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis}td.n{position:sticky;left:0;background:#fff}.lo{background:var(--lo);color:var(--no)}tfoot td{font-weight:700;background:#f3f6f3}
nav{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:0;font:600 11px system-ui;color:var(--mu);padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.6;padding:2px 14px;border-radius:12px}nav .on{color:var(--ink)}nav .on i{filter:none;opacity:1;background:var(--ac)}
.swal2-popup{font-family:system-ui!important;border-radius:24px!important;max-width:100%}.swal2-html-container{font-size:14px!important}
.tpg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tpg label{text-align:center;font-size:10px;margin:0}.tpg input{padding:9px 1px;text-align:center;font-size:15px;margin:2px 0}
.sm{color:var(--mu);font-size:12px;margin-bottom:8px}.pv{margin-top:10px;padding:9px;background:#f3f6f3;border-radius:12px;font-size:13px}
#fk{width:auto;max-width:100%;margin:6px 0 0;padding:4px 10px;border-radius:12px;background:#ffffff22;color:#fff;border:0;font:600 12px system-ui}#fk option{color:#142b2b}
/* login */
#lg{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto;background:linear-gradient(160deg,#0e3b3c 0%,#145a57 55%,#1c6b66 100%);animation:lgf .35s ease both}
#lg:before,#lg:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
#lg:before{width:320px;height:320px;right:-110px;top:-90px;background:radial-gradient(circle,#f2b23340,#f2b23300 70%)}
#lg:after{width:380px;height:380px;left:-150px;bottom:-140px;background:radial-gradient(circle,#ffffff22,#ffffff00 70%)}
.lgc{position:relative;width:100%;max-width:380px;background:#fff;border-radius:28px;padding:30px 24px 22px;box-shadow:0 30px 80px #04191a80;animation:lgu .5s cubic-bezier(.2,.8,.2,1) both}
.lgl{width:68px;height:68px;margin:-64px auto 12px;border-radius:22px;background:var(--ac);display:grid;place-items:center;font-size:34px;box-shadow:0 12px 26px #f2b23366,0 0 0 6px #fff}
.lgl img{display:block;width:44px;height:44px;object-fit:contain}
.lgc h2{text-align:center;font-size:22px;color:var(--ink);letter-spacing:-.3px}
.lgs{text-align:center;color:var(--mu);font-size:13px;margin:2px 0 14px}
.lge{min-height:0;margin:0 0 6px;padding:0;border-radius:12px;font-size:12.5px;color:var(--no);background:transparent;text-align:center}
.lge.on{padding:9px 12px;background:var(--lo)}
.lgc label{margin-top:10px}
.lgi{display:flex;align-items:center;gap:8px;margin-top:5px;padding:0 6px 0 14px;border:1.5px solid var(--ln);border-radius:14px;background:#f7faf8;transition:border-color .2s,box-shadow .2s,background .2s}
.lgi:focus-within{border-color:var(--ink);background:#fff;box-shadow:0 0 0 4px #0e3b3c1a}
.lgi svg{width:19px;height:19px;flex:none;stroke:var(--mu);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lgi:focus-within>svg{stroke:var(--ink)}
.lgi input{flex:1;min-width:0;margin:0;padding:14px 4px;border:0;outline:0;background:transparent;font-size:15px;color:#142b2b}
#lgt{flex:none;width:40px;height:40px;border:0;border-radius:11px;background:transparent;display:grid;place-items:center;cursor:pointer}
#lgt:active{background:#e3eee9}#lgt svg{stroke:var(--mu)}#lgt.on svg{stroke:var(--ink)}
#lgt .e2{display:none}#lgt.on .e1{display:none}#lgt.on .e2{display:block}
